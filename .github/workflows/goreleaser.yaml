name: goreleaser

on:
  push:
    tags:
      # version tags only: the runtime payload is published under runtime-*
      # tags by this very workflow, which must not retrigger it
      - "v*"

env:
  # Forks of apple/container with pause/resume + suspend-to-disk + transparent
  # egress (gvnet) support. The container repo's Package.swift references
  # ../containerization, so both are checked out as sibling directories.
  # Pinned to immutable commits (not the feat/gvnet-egress branch tip) so a
  # release is reproducible and can't silently pick up an untested fork change.
  # Bump these deliberately when the runtime needs a fork update.
  CONTAINER_REPO: philipparndt/container
  CONTAINER_REF: 1f752911cb98ac61bddb6d9dc0943e767fe15f3a
  CONTAINERIZATION_REPO: philipparndt/containerization
  CONTAINERIZATION_REF: c38670f3a8b78b46dbf4a0c062aab7b982e96861

jobs:
  # The Swift builds dominate the release time (~30 minutes) but only depend on
  # the fork sources, not on k3c. The finished payload (staging tree + init
  # image) is therefore built once per fork state and stored permanently as an
  # asset on a runtime-* prerelease; later k3c releases just download it. The
  # key covers both fork commits and the workflow hash (a stand-in for the
  # toolchain versions baked into the build).
  #
  # This job only decides whether that rebuild is needed, so the expensive jobs
  # below can be skipped wholesale on a cache hit. Both refs are pinned full
  # SHAs, so the key needs no checkout of the forks.
  payload:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.rt.outputs.key }}
      build: ${{ steps.rt.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute the runtime payload key and probe for a cached payload
        id: rt
        run: |
          key="runtime-arm64"
          key="$key-${CONTAINER_REF:0:12}"
          key="$key-${CONTAINERIZATION_REF:0:12}"
          key="$key-$(sha256sum .github/workflows/goreleaser.yaml | cut -c1-8)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "runtime payload key: $key"
          if gh release view "$key" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "payload release $key exists; skipping the runtime build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "no payload release $key; building from source"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  # The guest init image (vminitd + vmexec + initfs) is a Linux artifact, so it
  # is built on Linux. containerization used to cross-compile it from a macOS
  # host (`make -C vminitd cross-prep`, plus a cctl that built the ext4 itself),
  # but apple/containerization#810 moved that into a Linux dev container
  # launched by apple/container — which a GitHub macOS runner cannot provide.
  # Upstream split `init-image` out of `init` for exactly this case: build the
  # initfs on Linux, create the OCI image from the tar afterwards. We do both
  # here, so the macOS job below just consumes a finished init.tar.
  #
  # The container image mirrors images/linux-dev/Dockerfile in the fork (same
  # Swift release, same apt packages); the Static Linux SDK is installed by the
  # `linux-sdk` target rather than baked into the image. build-initfs.sh falls
  # back to `mke2fs -d` when no loop device is available, which is the case in
  # an unprivileged Actions container.
  initfs:
    needs: payload
    if: needs.payload.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    # Pinned to the exact patch release in the fork's .swift-version, NOT a
    # floating 6.3-noble: the Static Linux SDK pinned in vminitd/Makefile is the
    # 6.3.0 artifactbundle, and Swift refuses to import a module built by a
    # different compiler patch ("module compiled with Swift 6.3 cannot be
    # imported by the Swift 6.3.3 compiler"). Bump this together with the fork.
    container: swift:6.3.0-noble
    steps:
      - name: Install the initfs build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make git curl ca-certificates e2fsprogs \
            libarchive-dev libbz2-dev liblzma-dev libssl-dev
          apt-get clean

      - name: Checkout containerization fork
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CONTAINERIZATION_REPO }}
          ref: ${{ env.CONTAINERIZATION_REF }}

      # vminitd/Makefile shells out to `git rev-parse HEAD` for GIT_COMMIT, and
      # git refuses to read a repo owned by another uid inside the container.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the container Swift matches the fork's .swift-version
        # `swift --version` prints "6.3" for a .0 release but "6.3.3" for a
        # patch, while .swift-version spells out 6.3.0 — normalise a trailing
        # .0 on both sides so this guard cannot false-fail a correct pin.
        run: |
          norm() { echo "$1" | sed 's/\.0$//'; }
          want=$(norm "$(cat .swift-version)")
          have=$(norm "$(swift --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)")
          echo "fork wants $want, container has $have"
          [ "$want" = "$have" ] || {
            echo "::error::container swift $have != fork .swift-version $want — update the initfs job's container: tag"
            exit 1
          }

      - name: Install the Static Linux SDK
        # linux-sdk curls the artifactbundle, so curl must be present — the
        # fork's own dev image never needed it (`swift sdk install <url>` at
        # image-build time fetches directly).
        # The target ignores `swift sdk install` failures (`-@`, so re-installing
        # an existing SDK is not fatal), so verify the SDK is actually there
        # rather than failing later inside the build with a confusing error.
        run: |
          make -C vminitd linux-sdk
          swift sdk list
          swift sdk list | grep -q 'static-linux' \
            || { echo "::error::Static Linux SDK missing after linux-sdk"; exit 1; }

      - name: Build the init image (vminitd + vmexec + initfs)
        run: |
          make init BUILD_CONFIGURATION=release
          ./bin/cctl images save -o /tmp/k3c-init.tar vminit:latest
          ls -lh /tmp/k3c-init.tar

      - name: Upload the init image
        uses: actions/upload-artifact@v4
        with:
          name: k3c-init-tar
          path: /tmp/k3c-init.tar
          retention-days: 1
          if-no-files-found: error

  goreleaser:
    needs: [payload, initfs]
    # initfs is skipped on a payload cache hit; a skipped dependency must not
    # block the release.
    if: |
      always() && needs.payload.result == 'success'
      && (needs.initfs.result == 'success' || needs.initfs.result == 'skipped')
    permissions:
      contents: write
      packages: write
      pull-requests: write
    # macOS arm64: the container app is Swift/Virtualization.framework and
    # only runs on Apple Silicon.
    runs-on: macos-26
    env:
      BUILD_RUNTIME: ${{ needs.payload.outputs.build }}
      PAYLOAD_KEY: ${{ needs.payload.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout container fork
        if: env.BUILD_RUNTIME == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CONTAINER_REPO }}
          ref: ${{ env.CONTAINER_REF }}
          path: .forks/container

      - name: Checkout containerization fork
        if: env.BUILD_RUNTIME == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CONTAINERIZATION_REPO }}
          ref: ${{ env.CONTAINERIZATION_REF }}
          path: .forks/containerization

      - name: Restore runtime payload from release asset
        if: env.BUILD_RUNTIME == 'false'
        run: |
          gh release download "$PAYLOAD_KEY" -R "$GITHUB_REPOSITORY" \
            -p runtime-payload.tar.gz -O /tmp/runtime-payload.tar.gz
          mkdir -p /tmp/k3c-runtime
          tar -xzf /tmp/runtime-payload.tar.gz -C /tmp/k3c-runtime
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Select Xcode
        if: env.BUILD_RUNTIME == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download the init image built on Linux
        if: env.BUILD_RUNTIME == 'true'
        uses: actions/download-artifact@v4
        with:
          name: k3c-init-tar
          path: /tmp

      - name: Build container app (release)
        if: env.BUILD_RUNTIME == 'true'
        run: make -C .forks/container container BUILD_CONFIGURATION=release

      - name: Stage the full install tree (all plugins)
        if: env.BUILD_RUNTIME == 'true'
        run: make -C .forks/container stage BUILD_CONFIGURATION=release

      - name: Assemble runtime payload
        if: env.BUILD_RUNTIME == 'true'
        run: |
          STAGE=/tmp/k3c-runtime/stage
          STG=.forks/container/bin/release/staging
          mkdir -p "$STAGE/bin"
          cp "$STG/bin/container" "$STAGE/bin/"
          cp "$STG/bin/container-apiserver" "$STAGE/bin/"
          cp -R "$STG/libexec" "$STAGE/libexec"
          # fail the build rather than ship a runtime missing the transparent-
          # egress plugin (the bug that broke cluster create on bundled installs)
          test -x "$STAGE/libexec/container/plugins/container-network-gvnet/bin/container-network-gvnet" \
            || { echo "::error::container-network-gvnet plugin missing from staged runtime"; exit 1; }
          # the prebuilt 16K guest kernel ships from the pinned containerization
          # commit (kernel builds need a running container runtime, which CI
          # cannot provide); k3c installs it as the default kernel on create
          mkdir -p "$STAGE/kernel"
          cp .forks/containerization/kernel/vmlinux-16k "$STAGE/kernel/vmlinux-16k" \
            || { echo "::error::prebuilt 16K kernel missing from the containerization fork"; exit 1; }
          mv /tmp/k3c-init.tar /tmp/k3c-runtime/init.tar
          du -sh /tmp/k3c-runtime

      - name: Publish runtime payload as permanent release asset
        if: env.BUILD_RUNTIME == 'true'
        run: |
          tar -czf /tmp/runtime-payload.tar.gz -C /tmp/k3c-runtime .
          gh release create "$PAYLOAD_KEY" /tmp/runtime-payload.tar.gz \
            -R "$GITHUB_REPOSITORY" --prerelease \
            --title "container runtime payload ($PAYLOAD_KEY)" \
            --notes "Prebuilt container runtime (bin, libexec, init.tar) from ${{ env.CONTAINER_REPO }}@${{ env.CONTAINER_REF }} and ${{ env.CONTAINERIZATION_REPO }}@${{ env.CONTAINERIZATION_REF }}. Created automatically by the goreleaser workflow; safe to delete once no longer referenced."
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Bundle container runtime into payload
        run: make bundle STAGING_DIR=/tmp/k3c-runtime/stage INIT_TAR=/tmp/k3c-runtime/init.tar

      - name: Verify the bundled runtime ships every required plugin (present + entitled)
        # guards against shipping a runtime missing a plugin (e.g. the
        # transparent-egress container-network-gvnet, broken in v0.12.9–11) or
        # with a VM plugin lacking the virtualization entitlement (the apiserver
        # hang in v0.12.13). -run 'TestBundled' runs both bundled-payload guards.
        run: go test -tags bundled ./runtime/... -run 'TestBundled' -v

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
